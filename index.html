<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Render LaTeX formulas with KaTeX and download them as high-resolution PNG files.">
  <title>LaTeX to PNG</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.css"
    crossorigin="anonymous"
  >

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.js"
    crossorigin="anonymous"
    onerror="window.katexLoadFailed = true"
  ></script>

  <script 
    defer 
    src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/contrib/auto-render.min.js" 
    crossorigin="anonymous"
  ></script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
    onerror="window.imageLibraryLoadFailed = true"
  ></script>

  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #66758c;
      --line: #dbe3f0;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --surface: #ffffff;
      --page: #f3f6fb;
      --error: #dc2626;
      --success: #137a55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .page-header { margin-bottom: 24px; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 12px 35px rgba(33, 52, 85, 0.06);
    }

    .input-heading,
    .preview-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
    }

    label {
      display: block;
      font-weight: 650;
    }

    textarea, select, button, input { font: inherit; }

    textarea {
      display: block;
      width: 100%;
      min-height: 300px;
      padding: 16px;
      resize: vertical;
      color: #14213a;
      border: 1px solid #bac7da;
      border-radius: 10px;
      outline: none;
      background: #fcfdff;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 15px;
      line-height: 1.6;
      tab-size: 2;
    }

    textarea:focus, select:focus-visible, button:focus-visible, input:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    select {
      min-height: 42px;
      padding: 8px 34px 8px 11px;
      color: var(--ink);
      border: 1px solid #bac7da;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
    }

    #example {
      width: auto;
      min-width: 150px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .control-label {
      margin-bottom: 6px;
      color: #40506a;
      font-size: 0.78rem;
    }

    .controls select { width: 100%; }

    .checkbox-control {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 11px;
      border: 1px solid #bac7da;
      border-radius: 8px;
    }

    .checkbox-control label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-size: 0.9rem;
      font-weight: 400;
      cursor: pointer;
    }

    .checkbox-control input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--accent);
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      color: #ffffff;
      background: var(--accent);
      cursor: pointer;
      font-weight: 700;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.58;
      cursor: wait;
    }

    #message {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #message.error { color: var(--error); }
    #message.success { color: var(--success); }

    .support-box {
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 9px;
      color: #53627a;
      background: #f5f8fd;
      font-size: 0.8rem;
      line-height: 1.55;
    }

    .support-box strong { color: #32435e; }
    code {
      padding: 0.08em 0.32em;
      border-radius: 4px;
      color: #244c9b;
      background: #eaf0fb;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    .preview-panel {
      display: flex;
      min-height: 570px;
      flex-direction: column;
    }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 650;
    }

    #status::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      content: "";
    }

    #status.ready::before { background: #16a36a; }
    #status.error::before { background: #dc2626; }

    .preview-stage {
      display: grid;
      min-width: 0;
      flex: 1;
      place-items: center;
      overflow: auto;
      padding: 30px;
      border: 1px solid #e1e7f0;
      border-radius: 12px;
      background-color: #f1f5f9;
    }

    #export-area {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(30, 47, 77, 0.16);
      max-width: 100%;
    }

    #export-area.transparent {
      background: transparent;
      box-shadow: none;
    }

    #preview {
      display: inline-block;
      max-width: 100%;
    }
    
    #preview:not(.text-mode) { white-space: nowrap; }

    #preview.text-mode {
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.6;
      text-align: left;
    }

    #preview .katex-display { margin: 1em 0; }

    .placeholder {
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .preview-panel { min-height: 430px; }
    }

    @media (max-width: 520px) {
      body { padding: 24px 12px; }
      .panel { padding: 18px; }
      .input-heading {
        align-items: stretch;
        flex-direction: column;
      }
      #example, .controls { width: 100%; }
      .controls { grid-template-columns: 1fr; }
      .preview-stage { padding: 20px; }
    }
  </style>
</head>

<body>
  <main>
    <header class="page-header">
      <h1>LaTeX → PNG</h1>
      <p class="subtitle">Write pure formulas or text mixed with equations, auto-preview with KaTeX, and download.</p>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="input-title">
        <div class="input-heading">
          <h2 id="input-title">Input</h2>

          <select id="example" aria-label="Load a formula example">
            <option value="">Load an example…</option>
            <option value="mixed">Mixed text & formulas</option>
            <option value="spectral">Spectral theorem</option>
            <option value="integral">Integral</option>
            <option value="aligned">Aligned equations</option>
            <option value="cases">Cases</option>
            <option value="matrix">Matrix</option>
          </select>
        </div>

        <textarea id="latex-input" spellcheck="false" aria-label="LaTeX formula">T = \int_{\sigma(T)} \lambda\, dE(\lambda).</textarea>

        <div class="controls">
          <div>
            <label class="control-label" for="formula-size">Output size</label>
            <select id="formula-size">
              <option value="1">Small</option>
              <option value="1.25" selected>Medium</option>
              <option value="1.6">Large</option>
              <option value="2">Extra large</option>
            </select>
          </div>

          <div>
            <label class="control-label" for="padding">Export padding</label>
            <select id="padding">
              <option value="20">20 px</option>
              <option value="40" selected>40 px</option>
              <option value="60">60 px</option>
              <option value="80">80 px</option>
            </select>
          </div>

          <div>
            <label class="control-label" for="scale">PNG resolution</label>
            <select id="scale">
              <option value="2">2×</option>
              <option value="3" selected>3×</option>
              <option value="4">4×</option>
            </select>
          </div>

          <div class="checkbox-control">
            <label for="transparent">
              <input id="transparent" type="checkbox">
              Transparent background
            </label>
          </div>
        </div>

        <button id="download-button" type="button" disabled>Download PNG</button>
        <div id="message" aria-live="polite">Loading KaTeX…</div>

        <div class="support-box">
          <strong>Smart Auto-Render:</strong> Paste pure equations, multiple <code>\begin{...}</code> blocks, or text mixed with formulas.
        </div>
      </section>

      <section class="panel preview-panel" aria-labelledby="preview-title">
        <div class="preview-heading">
          <h2 id="preview-title">Preview</h2>
          <span id="status">Loading</span>
        </div>

        <div class="preview-stage">
          <div id="export-area">
            <div id="preview">
              <span class="placeholder">Preparing KaTeX…</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const DOWNLOAD_COUNTER_KEY = "latex-png-download-number";

    const examples = {
      mixed: String.raw`Mixed text and formulas. The inverse of $G$ is
\[
G^{-1} = \frac{1}{AB - C^2}
\begin{pmatrix} B & -C \\ -C & A \end{pmatrix}.
\]

Hence
\[
\begin{pmatrix} \alpha \\ \beta \end{pmatrix}
= G^{-1} \begin{pmatrix} 1 \\ 0 \end{pmatrix},
\qquad
\begin{pmatrix} \gamma \\ \delta \end{pmatrix}
= G^{-1} \begin{pmatrix} 0 \\ 1 \end{pmatrix}.
\]

Now compute
\[
p \cdot q = (\alpha a + \beta b) \cdot (\gamma a + \delta b).
\]
This equals
\[
\alpha \gamma |a|^2 + (\alpha \delta + \beta \gamma)(a \cdot b) + \beta \delta |b|^2.
\]`,

      spectral: String.raw`T = \int_{\sigma(T)} \lambda\, dE(\lambda).`,

      integral: String.raw`\begin{aligned}
\int_{\frac14}^{\frac34}\frac{1}{2\sqrt{x}}\,dx
&= \left[\sqrt{x}\right]_{\frac14}^{\frac34} \\[4pt]
&= \sqrt{\frac34}-\sqrt{\frac14} \\[4pt]
&= \boxed{\frac{\sqrt3-1}{2}}.
\end{aligned}`,

      aligned: String.raw`\begin{aligned}
\phi_j(x_i)-\phi_j(x_k) &= 0-0=0, \\[5pt]
\phi_j(x_j)-\phi_j(x_k) &= 1-0=1.
\end{aligned}`,

      cases: String.raw`f(x)=
\begin{cases}
x^2, & x\ge 0, \\
-x, & x<0.
\end{cases}`,

      matrix: String.raw`A=
\begin{pmatrix}
a & b \\
c & d
\end{pmatrix},
\qquad
A^{-1}=\frac{1}{ad-bc}
\begin{pmatrix}
d & -b \\
-c & a
\end{pmatrix}.`
    };

    const latexInput = document.getElementById("latex-input");
    const exampleSelect = document.getElementById("example");
    const sizeSelect = document.getElementById("formula-size");
    const paddingSelect = document.getElementById("padding");
    const scaleSelect = document.getElementById("scale");
    const transparentInput = document.getElementById("transparent");
    const preview = document.getElementById("preview");
    const exportArea = document.getElementById("export-area");
    const downloadButton = document.getElementById("download-button");
    const message = document.getElementById("message");
    const status = document.getElementById("status");

    let renderTimer = 0;
    let renderIsValid = false;
    let librariesReady = false;

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = type;
    }

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
    }

    function normalizeLatex(value) {
      let latex = value.trim();

      const fenced = latex.match(/^```(?:latex|tex)?\s*([\s\S]*?)\s*
