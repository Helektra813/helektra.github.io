<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Render LaTeX formulas with KaTeX and download them as high-resolution PNG files.">
  <title>LaTeX to PNG</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.css"
    crossorigin="anonymous"
  >

  <!-- KaTeX Core -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/katex.min.js"
    crossorigin="anonymous"
    onerror="window.katexLoadFailed = true"
  ></script>

  <!-- KaTeX Auto-render Extension -->
  <script 
    defer 
    src="https://cdn.jsdelivr.net/npm/katex@0.18.5/dist/contrib/auto-render.min.js" 
    crossorigin="anonymous"
  ></script>

  <!-- HTML to Image -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"
    onerror="window.imageLibraryLoadFailed = true"
  ></script>

  <style>
    :root {
      color-scheme: light;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --ink: #172033;
      --muted: #64748b;
      --border: #dbe3f0;
      --page: #f3f6fb;
      --error: #dc2626;
      --success: #137a55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      color: var(--ink);
      background: var(--page);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    h1, h2 {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 0;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.035em;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: var(--muted);
      line-height: 1.6;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      min-width: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgb(15 23 42 / 5%);
    }

    .input-panel {
      padding: 24px;
    }

    .input-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .input-heading h2 {
      margin: 0;
      font-size: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 650;
      color: #334155;
      font-size: 0.86rem;
    }

    textarea, select, button, input {
      font: inherit;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 330px;
      padding: 16px;
      resize: vertical;
      color: var(--ink);
      background: white;
      border: 1px solid #bac7da;
      border-radius: 10px;
      outline: none;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 15px;
      line-height: 1.65;
    }

    textarea:focus, select:focus-visible, button:focus-visible, input:focus-visible {
      border-color: var(--accent);
      outline: 3px solid rgb(37 99 235 / 18%);
      outline-offset: 1px;
    }

    select {
      width: 100%;
      min-height: 42px;
      padding: 8px 14px;
      color: var(--ink);
      background: white;
      border: 1px solid #bac7da;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #example {
      width: auto;
      min-width: 150px;
      min-height: 36px;
      padding: 6px 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .checkbox-control {
      display: flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 11px;
      border: 1px solid #bac7da;
      border-radius: 8px;
    }

    .checkbox-control label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
    }

    .checkbox-control input {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--accent);
    }

    .primary-button {
      width: 100%;
      min-height: 46px;
      margin-top: 16px;
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font-weight: 650;
      transition: background 120ms ease;
    }

    .primary-button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .primary-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message-box {
      min-height: 24px;
      margin-top: 12px;
      color: var(--muted);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message-box.error { color: var(--error); }
    .message-box.success { color: var(--success); }

    .support-box {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 9px;
      color: #53627a;
      background: #f5f8fd;
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .support-box strong { color: #32435e; }
    code {
      padding: 0.1em 0.35em;
      background: #eff6ff;
      border-radius: 4px;
      color: #1d4ed8;
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    /* PREVIEW STAGE STYLES */
    .preview-stage {
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      min-height: 600px;
    }

    .preview-header {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      background: white;
      border-bottom: 1px solid var(--border);
      font-weight: 650;
      font-size: 1.1rem;
    }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    #status::before {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      content: "";
    }
    #status.ready::before { background: #16a36a; }
    #status.error::before { background: #dc2626; }

    .preview-scroller {
      display: grid;
      place-items: center;
      flex: 1;
      overflow: auto;
      padding: 40px;
      background-color: var(--page);
    }

    #formula-export-area {
      color: var(--ink);
      background: white;
      border: 2px solid var(--accent);
      border-radius: 18px;
      padding: 40px;
      transition: border-color 150ms ease, background 150ms ease;
    }

    #formula-export-area.transparent {
      background: transparent;
      border-color: transparent;
    }

    /* Auto layout width based on content type */
    #formula-export-area.is-formula {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: max-content;
      min-width: 250px;
    }

    #formula-export-area.is-mixed {
      display: block;
      width: 680px;
      max-width: 100%;
    }

    #formula-preview {
      color: inherit;
      font-family: Georgia, "Times New Roman", "Cambria Math", serif;
      line-height: 1.7;
    }

    #formula-export-area.is-formula #formula-preview {
      width: max-content;
      white-space: nowrap;
    }

    #formula-export-area.is-mixed #formula-preview {
      width: 100%;
      white-space: pre-wrap;
      word-wrap: break-word;
      text-align: left;
    }

    #formula-preview .katex-display {
      margin: 1em 0;
    }

    .placeholder {
      color: var(--muted);
      font-size: 0.95rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .preview-stage {
        min-height: 480px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="page-header">
      <h1>LaTeX → PNG</h1>
      <p class="subtitle">Write pure formulas or text mixed with equations, auto-preview with KaTeX, and download.</p>
    </header>

    <div class="layout">
      <section class="panel input-panel" aria-labelledby="input-title">
        <div class="input-heading">
          <h2 id="input-title">Input</h2>

          <select id="example" aria-label="Load a formula example">
            <option value="">Load an example…</option>
            <option value="mixed">Mixed text & formulas</option>
            <option value="spectral">Spectral theorem</option>
            <option value="integral">Integral</option>
            <option value="cases">Cases</option>
            <option value="matrix">Matrix</option>
          </select>
        </div>

        <textarea id="latex-input" spellcheck="false" aria-label="LaTeX formula">T = \int_{\sigma(T)} \lambda\, dE(\lambda).</textarea>

        <div class="controls">
          <div>
            <label for="formula-size">Output size</label>
            <select id="formula-size">
              <option value="1">Small</option>
              <option value="1.25" selected>Medium</option>
              <option value="1.6">Large</option>
              <option value="2">Extra large</option>
            </select>
          </div>

          <div>
            <label for="padding">Export padding</label>
            <select id="padding">
              <option value="20">20 px</option>
              <option value="40" selected>40 px</option>
              <option value="60">60 px</option>
              <option value="80">80 px</option>
            </select>
          </div>

          <div>
            <label for="scale">PNG resolution</label>
            <select id="scale">
              <option value="2">2×</option>
              <option value="3" selected>3×</option>
              <option value="4">4×</option>
            </select>
          </div>

          <div class="checkbox-control">
            <label for="transparent">
              <input id="transparent" type="checkbox">
              Transparent bg
            </label>
          </div>
        </div>

        <button id="download-button" class="primary-button" type="button" disabled>Download PNG</button>
        <div id="message" class="message-box" aria-live="polite">Loading KaTeX…</div>

        <div class="support-box">
          <strong>Smart Auto-Render:</strong> Paste pure equations, multiple <code>\begin{...}</code> blocks, or text mixed with <code>$$...$$</code> formulas.
        </div>
      </section>

      <section class="panel preview-stage" aria-labelledby="preview-title">
        <div class="preview-header">
          <span id="preview-title">Formula Preview</span>
          <span id="status">Loading</span>
        </div>

        <div class="preview-scroller">
          <div id="formula-export-area" class="is-formula">
            <div id="formula-preview">
              <span class="placeholder">Preparing KaTeX…</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const DOWNLOAD_COUNTER_KEY = "latex-png-download-number";

    const examples = {
      mixed: String.raw`Mixed text and formulas. The inverse of $G$ is
\[
G^{-1} = \frac{1}{AB - C^2}
\begin{pmatrix} B & -C \\ -C & A \end{pmatrix}.
\]

Hence
\[
\begin{pmatrix} \alpha \\ \beta \end{pmatrix}
= G^{-1} \begin{pmatrix} 1 \\ 0 \end{pmatrix},
\qquad
\begin{pmatrix} \gamma \\ \delta \end{pmatrix}
= G^{-1} \begin{pmatrix} 0 \\ 1 \end{pmatrix}.
\]

Now compute
\[
p \cdot q = (\alpha a + \beta b) \cdot (\gamma a + \delta b).
\]
This equals
\[
\alpha \gamma |a|^2 + (\alpha \delta + \beta \gamma)(a \cdot b) + \beta \delta |b|^2.
\]`,

      spectral: String.raw`T = \int_{\sigma(T)} \lambda\, dE(\lambda).`,

      integral: String.raw`\begin{aligned}
\int_{\frac14}^{\frac34}\frac{1}{2\sqrt{x}}\,dx
&= \left[\sqrt{x}\right]_{\frac14}^{\frac34} \\[4pt]
&= \sqrt{\frac34}-\sqrt{\frac14} \\[4pt]
&= \boxed{\frac{\sqrt3-1}{2}}.
\end{aligned}`,

      cases: String.raw`f(x)=
\begin{cases}
x^2, & x\ge 0, \\
-x, & x<0.
\end{cases}`,

      matrix: String.raw`A=
\begin{pmatrix}
a & b \\
c & d
\end{pmatrix},
\qquad
A^{-1}=\frac{1}{ad-bc}
\begin{pmatrix}
d & -b \\
-c & a
\end{pmatrix}.`
    };

    const latexInput = document.getElementById("latex-input");
    const exampleSelect = document.getElementById("example");
    const sizeSelect = document.getElementById("formula-size");
    const paddingSelect = document.getElementById("padding");
    const scaleSelect = document.getElementById("scale");
    const transparentInput = document.getElementById("transparent");
    
    const formulaPreview = document.getElementById("formula-preview");
    const formulaExportArea = document.getElementById("formula-export-area");
    const downloadButton = document.getElementById("download-button");
    const message = document.getElementById("message");
    const status = document.getElementById("status");

    let renderTimer = 0;
    let renderIsValid = false;
    let librariesReady = false;

    function setMessage(text, type = "") {
      message.textContent = text;
      message.className = `message-box ${type}`;
    }

    function setStatus(text, type = "") {
      status.textContent = text;
      status.className = type;
    }

    function normalizeLatex(value) {
      let latex = value.trim();

      const fenced = latex.match(/^```(?:latex|tex)?\s*([\s\S]*?)\s*```$/i);
      if (fenced) {
        latex = fenced[1].trim();
      }

      const wrappers = [
        /^\\\[([\s\S]*)\\\]$/,
        /^\$\$([\s\S]*)\$\$$/,
        /^\\\(([\s\S]*)\\\)$/,
        /^\$([^$][\s\S]*?)\$$/
      ];

      for (const wrapper of wrappers) {
        const match = latex.match(wrapper);
        if (match) {
          latex = match[1].trim();
          break;
        }
      }
      return latex;
    }

    function updateExportStyle() {
      formulaExportArea.style.padding = `${Number(paddingSelect.value)}px`;
      formulaExportArea.classList.toggle("transparent", transparentInput.checked);
      formulaPreview.style.fontSize = `${Number(sizeSelect.value)}rem`;
    }

    function renderFormula() {
      renderIsValid = false;
      downloadButton.disabled = true;

      const rawValue = latexInput.value;

      if (!rawValue.trim()) {
        formulaPreview.replaceChildren();
        setStatus("Empty", "error");
        setMessage("Enter content to begin.", "error");
        return false;
      }

      if (!librariesReady || typeof window.katex === "undefined") {
        setStatus("Loading");
        setMessage("Loading KaTeX…");
        return false;
      }

      updateExportStyle();

      // Smart Detection Logic
      const hasDelimiters = /(\$\$|\\\[|\\\]|\\\(|\\\)|(^|[^\\])\$)/.test(rawValue);
      const hasChinese = /[\u4e00-\u9fa5]/.test(rawValue);
      const beginMatches = rawValue.match(/\\begin\{[a-zA-Z*]+\}/g);
      const hasMultipleEnvironments = beginMatches && beginMatches.length > 1;

      const shouldUseTextMode = hasDelimiters || hasChinese || hasMultipleEnvironments;

      // Adjust box width dynamically based on content type
      formulaExportArea.classList.toggle("is-mixed", shouldUseTextMode);
      formulaExportArea.classList.toggle("is-formula", !shouldUseTextMode);

      try {
        if (shouldUseTextMode) {
          if (typeof renderMathInElement === "undefined") {
            throw new Error("KaTeX auto-render extension is not loaded yet.");
          }
          
          formulaPreview.textContent = rawValue;
          
          renderMathInElement(formulaPreview, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '\\[', right: '\\]', display: true},
              {left: '\\begin{aligned}', right: '\\end{aligned}', display: true},
              {left: '\\begin{align}', right: '\\end{align}', display: true},
              {left: '\\begin{align*}', right: '\\end{align*}', display: true},
              {left: '\\begin{cases}', right: '\\end{cases}', display: true},
              {left: '\\begin{matrix}', right: '\\end{matrix}', display: true},
              {left: '\\begin{pmatrix}', right: '\\end{pmatrix}', display: true},
              {left: '\\begin{bmatrix}', right: '\\end{bmatrix}', display: true},
              {left: '\\begin{vmatrix}', right: '\\end{vmatrix}', display: true},
              {left: '\\begin{Vmatrix}', right: '\\end{Vmatrix}', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false,
            strict: "warn"
          });
        } else {
          const latex = normalizeLatex(rawValue);

          if (/\\(?:documentclass|usepackage|begin\s*\{document\})/.test(latex)) {
            formulaPreview.replaceChildren();
            setStatus("Formula only", "error");
            setMessage("Paste only the formula, not a complete LaTeX document.", "error");
            return false;
          }

          katex.render(latex, formulaPreview, {
            displayMode: true,
            throwOnError: true,
            trust: false,
            strict: "warn",
            output: "htmlAndMathml"
          });
        }

        renderIsValid = true;
        downloadButton.disabled = false;
        setStatus("Ready", "ready");
        setMessage("Rendered successfully.", "success");
        return true;
      } catch (error) {
        formulaPreview.replaceChildren();
        setStatus("Error", "error");
        setMessage(`LaTeX error: ${error.message}`, "error");
        return false;
      }
    }

    function scheduleRender() {
      window.clearTimeout(renderTimer);
      renderTimer = window.setTimeout(renderFormula, 160);
    }

    function nextPngFilename() {
      let nextNumber = 1;
      try {
        const stored = Number.parseInt(localStorage.getItem(DOWNLOAD_COUNTER_KEY), 10);
        if (Number.isFinite(stored) && stored >= 1) {
          nextNumber = stored;
        }
        localStorage.setItem(DOWNLOAD_COUNTER_KEY, String(nextNumber + 1));
      } catch (error) {}

      return `${String(nextNumber).padStart(3, "0")}.png`;
    }

    function triggerDownload(dataUrl, filename) {
      const link = document.createElement("a");
      link.download = filename;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function downloadPng() {
      if (!renderFormula()) return;

      downloadButton.disabled = true;
      downloadButton.textContent = "Creating PNG…";
      setMessage("Embedding KaTeX fonts and creating the PNG…");

      try {
        await document.fonts.ready;
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const fontEmbedCSS = await htmlToImage.getFontEmbedCSS(formulaExportArea);
        const pngDataUrl = await htmlToImage.toPng(formulaExportArea, {
          pixelRatio: Number(scaleSelect.value),
          cacheBust: false,
          preferredFontFormat: "woff2",
          fontEmbedCSS,
          backgroundColor: transparentInput.checked ? undefined : "#ffffff"
        });

        triggerDownload(pngDataUrl, nextPngFilename());
        setMessage("PNG downloaded successfully.", "success");
      } catch (error) {
        setMessage(`PNG download failed: ${error.message}`, "error");
      } finally {
        downloadButton.textContent = "Download PNG";
        downloadButton.disabled = !renderIsValid;
      }
    }

    function initialize() {
      updateExportStyle();

      if (window.katexLoadFailed || typeof window.katex === "undefined") {
        setStatus("Unavailable", "error");
        setMessage("KaTeX could not be loaded. Check your connection and refresh the page.", "error");
        return;
      }

      if (window.imageLibraryLoadFailed || typeof window.htmlToImage === "undefined") {
        setStatus("Unavailable", "error");
        setMessage("The PNG export library could not be loaded. Check your connection.", "error");
        return;
      }

      librariesReady = true;
      renderFormula();
    }

    latexInput.addEventListener("input", () => {
      exampleSelect.value = "";
      scheduleRender();
    });

    exampleSelect.addEventListener("change", () => {
      if (examples[exampleSelect.value]) {
        latexInput.value = examples[exampleSelect.value];
        renderFormula();
      }
    });

    sizeSelect.addEventListener("change", renderFormula);
    paddingSelect.addEventListener("change", () => {
      updateExportStyle();
      setMessage("Export padding updated.", "success");
    });
    
    transparentInput.addEventListener("change", () => {
      updateExportStyle();
      setMessage(
        transparentInput.checked ? "Transparent background enabled." : "White background enabled.",
        "success"
      );
    });

    downloadButton.addEventListener("click", downloadPng);
    window.addEventListener("DOMContentLoaded", initialize);
  </script>
</body>
</html>
